name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: blackvault-svelte/package-lock.json

      - name: Install dependencies
        working-directory: blackvault-svelte
        run: npm ci

      - name: Build
        working-directory: blackvault-svelte
        run: npm run build
        # No BASE_PATH needed — Cloudflare Pages serves from root

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy blackvault-svelte/dist --project-name=blackvault --commit-dirty=true
